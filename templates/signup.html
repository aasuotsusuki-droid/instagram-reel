{% extends "base.html" %}{% block title %}Register — FF VOTE{% endblock %}
{% block content %}<div class="auth"><form method="post" class="panel">
<p class="eyebrow">JOIN THE BATTLE</p><h1>CREATE VOTER ACCOUNT</h1>

<label>Free Fire Username<input name="username" required minlength="3" autocomplete="username"></label>

<label>Free Fire Email<input type="email" name="email" required autocomplete="email"></label>

<label>Account Password<input type="password" name="password" required minlength="6" autocomplete="new-password"></label>

<label>Confirm Account Password<input type="password" name="confirm" required autocomplete="new-password"></label>

<button class="btn" type="submit">REGISTER</button>
<p>Already registered? <a href="{{url_for('login')}}">Login</a></p>
</form></div>{% endblock %}
