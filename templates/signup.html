{% extends "base.html" %}{% block title %}Sign Up — FF VOTE{% endblock %}
{% block content %}<div class="auth"><form method="post" class="panel">
<p class="eyebrow">JOIN THE COMMUNITY</p><h1>CREATE ACCOUNT</h1>
<label>Username<input name="username" required minlength="3" autocomplete="username"></label>
<label>Email<input type="email" name="email" required autocomplete="email"></label>
<label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
<label>Confirm Password<input type="password" name="confirm" required autocomplete="new-password"></label>
<button class="btn" type="submit">SIGN UP</button>
<p>Already registered? <a href="{{url_for('login')}}">Login</a></p>
</form></div>{% endblock %}
