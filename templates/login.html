{% extends "base.html" %}{% block title %}Login — FF VOTE{% endblock %}
{% block content %}<div class="auth"><form method="post" class="panel">
<p class="eyebrow">WELCOME BACK</p><h1>LOGIN</h1>
<label>Username or Email<input name="identity" required autocomplete="username"></label>

</form></div>{% endblock %}
